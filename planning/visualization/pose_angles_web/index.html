<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>洁治器规划</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
  <script src="./vendor/lucide.min.js"></script>
</head>
<body>
  <header>
    <h1>洁治器规划</h1>
    <span class="status">姿态预览</span>
    <div class="toolbar">
      <button id="fit" title="适配视角" aria-label="适配视角"><i data-lucide="scan"></i></button>
      <button id="reset" title="角度归零" aria-label="角度归零"><i data-lucide="rotate-ccw"></i></button>
      <button id="copy" title="复制三个角度" aria-label="复制三个角度"><i data-lucide="copy"></i></button>
      <button id="save" title="导出姿态 JSON" aria-label="导出姿态 JSON"><i data-lucide="download"></i></button>
    </div>
  </header>
  <main>
    <section id="viewport" aria-label="牙模与洁治器三维视图">
      <div id="loading" role="status">正在载入牙模…</div>
      <div class="legend"><span><b class="x"></b>TCP X</span><span><b class="y"></b>TCP Y</span><span><b class="z"></b>TCP Z</span><span><b class="path"></b>牙龈线</span></div>
      <div id="scene-status" role="status"></div>
    </section>
    <aside>
      <div id="source-status" class="source-status"></div>
      <div class="field"><label for="region">牙龈区域</label><select id="region"></select></div>
      <div class="field"><label for="scope">牙模范围</label><select id="scope"><option value="tooth">局部牙冠</option><option value="mandibular">完整下颌</option><option value="both">上下颌</option></select></div>
      <fieldset class="mode"><legend>姿态参考</legend><div role="group" aria-label="姿态参考"><button data-mode="simple" aria-pressed="true">区域固定</button><button data-mode="local_surface" aria-pressed="false">局部牙面</button><button data-mode="continuous" aria-pressed="false" title="严格使用局部角度">局部严格</button></div></fieldset>
      <div id="angles"></div>
      <div class="slider-field"><label for="offset">离面距离 <span>mm</span></label><input id="offset-number" type="number" min="0" max="30" step="0.01" aria-label="离面距离数值"><input id="offset" type="range" min="0" max="30" step="0.01" aria-label="离面距离"></div>
      <div class="slider-field station"><label for="station">路径位置 <span>mm</span></label><input id="station-number" type="number" min="0" step="0.01" aria-label="路径位置数值"><input id="station" type="range" min="0" step="0.01" aria-label="路径位置"></div>
      <div class="pick-row"><label><input id="pick" type="checkbox">牙面选点</label><button id="restore" title="恢复路径参考点" aria-label="恢复路径参考点"><i data-lucide="map-pin-off"></i></button></div>
      <div class="toggles"><label><input id="tool-full" type="checkbox">完整器械</label><label><input id="axes" type="checkbox" checked>TCP 坐标轴</label><label><input id="reference" type="checkbox">固定参考轴</label></div>
      <dl><div><dt>三角度 · °</dt><dd id="angle-values">–</dd></div><div><dt>参考点 · 口扫 mm</dt><dd id="point-values">–</dd></div><div><dt>参考来源</dt><dd id="reference-value">牙龈路径</dd></div></dl>
      <section class="planning" aria-label="规划参数与结果">
        <h2>轨迹规划 <span>非接触</span></h2>
        <div class="field"><label for="trace-speed">沿线速度 · mm/s</label><input id="trace-speed" type="number" min="0.001" step="any" required></div>
        <div class="field"><label for="transfer-speed">进出场速度 · mm/s</label><input id="transfer-speed" type="number" min="0.001" step="any" required></div>
        <details><summary>高级参数</summary>
          <div class="field"><label for="pose-spacing">姿态采样 · mm</label><input id="pose-spacing" type="number" min="0.001" step="any" required></div>
          <label class="check-field"><input id="local-search" type="checkbox">逐位置角度微调</label>
        </details>
        <div class="plan-actions">
          <button id="check-reach" disabled><i data-lucide="scan-line"></i>可达性检查</button>
          <button id="plan-full" disabled><i data-lucide="route"></i>完整规划</button>
          <button id="cancel-plan" title="取消本次规划" aria-label="取消本次规划" disabled><i data-lucide="square"></i></button>
          <button id="export-plan" title="导出当前规划配置" aria-label="导出当前规划配置" disabled><i data-lucide="file-down"></i></button>
        </div>
        <div id="plan-status" role="status">未规划</div>
        <div id="plan-stale" hidden>参数已改变，待重新规划</div>
        <div id="plan-result" hidden>
          <dl id="plan-metrics"></dl>
          <label class="check-field"><input id="trajectory-visible" type="checkbox" checked>实际 TCP 路径</label>
          <details><summary>本次参数</summary><pre id="plan-parameters"></pre></details>
          <details><summary>诊断日志</summary><pre id="plan-log"></pre></details>
          <details><summary>结果目录与回放</summary><code id="plan-directory"></code><pre id="replay-command"></pre><button id="copy-replay" title="复制回放命令" aria-label="复制回放命令"><i data-lucide="copy"></i></button></details>
        </div>
        <div id="plan-error" role="alert" hidden></div>
      </section>
      <div id="error" role="alert" hidden></div>
    </aside>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
